<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pokemon Fight</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="body">

    <!-- Логотип -->
    <header>
        <img
            class="logo"
            id="logo"
            src="./assets/Pokemon_logo.png"
            alt="Pokemon"
            title="Почати гру заново"
        >
    </header>


    <!-- Поле бою -->
    <div class="playground">


        <!-- PIKACHU -->
        <div class="pokemon character">

            <span class="lvl">
                Lv. 1
            </span>

            <img
                src="./assets/pikachu.png"
                class="sprite"
                alt="Pikachu"
            >

            <div class="details">

                <h2
                    class="name"
                    id="name-character"
                >
                    Pikachu
                </h2>


                <div class="hp">

                    <div class="bar">

                        <div
                            class="health"
                            id="progressbar-character"
                            style="width: 100%;">
                        </div>

                    </div>

                    <span
                        class="text"
                        id="health-character"
                    >
                        100 / 100
                    </span>

                </div>

            </div>

        </div>


        <!-- КНОПКИ АТАКИ -->
        <div class="control">

            <button
                class="button"
                id="btn-kick"
            >
                Thunder Jolt
            </button>


            <button
                class="button"
                id="btn-kick-strong"
            >
                Electro Ball
            </button>

        </div>


        <!-- CHARMANDER -->
        <div class="pokemon enemy">

            <span class="lvl">
                Lv. 1
            </span>

            <img
                src="./assets/charmander.png"
                class="sprite"
                alt="Charmander"
            >

            <div class="details">

                <h2
                    class="name"
                    id="name-enemy"
                >
                    Charmander
                </h2>


                <div class="hp">

                    <div class="bar">

                        <div
                            class="health"
                            id="progressbar-enemy"
                            style="width: 100%;">
                        </div>

                    </div>

                    <span
                        class="text"
                        id="health-enemy"
                    >
                        100 / 100
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Інформація про бій -->
    <div
        class="battle-info"
        id="battle-info"
    >
        Оберіть атаку
    </div>

</div>


<div class="catch_screen"></div>


<script src="main.js"></script>

</body>

</html>
